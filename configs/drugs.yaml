# Bloodstream-infection drug panel across the five species in scope.
#
# Drug keys are the normalized names used everywhere else: lowercase,
# hyphenated, no spaces or slashes (e.g. piperacillin-tazobactam).
#
# synonyms       Raw spellings seen in BV-BRC / NCBI AST exports and lab
#                systems: WHONET / CLSI / EUCAST abbreviations, salt forms,
#                brand names, slash-separated combination names. Matching is
#                case-insensitive and ignores whitespace / slash / hyphen
#                differences, so one spelling per distinct token sequence is
#                enough.
# spectrum_tier  1 narrowest ... 4 broadest / reserve. Likely-active drugs are
#                ranked narrowest first, then by margin below the S breakpoint.
# strong_markers Known-AMR feature columns (gene_* / point_*) whose presence
#                forces the call to likely_inactive regardless of the model
#                (override 2 in DATA_CONTRACT.md stage 12). Matched as column
#                prefixes so kept variants (gene_blakpc_2) still match.
#
# call_standard  Breakpoint table used for pred_sir and for the final call.

call_standard:
  standard: EUCAST
  version: "2024"

drugs:
