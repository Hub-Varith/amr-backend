      # armA -> gene_arma, rmtB1 -> gene_rmtb1 (matched by the gene_rmtb prefix), npmA -> gene_npma.
      - gene_arma
      - gene_rmta
      - gene_rmtb
      - gene_rmtc
      - gene_rmtd
      - gene_rmte
      - gene_rmtf
      - gene_rmtg
      - gene_rmth
