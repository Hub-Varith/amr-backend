# Bloodstream-infection drug panel across the five species in scope.
#
# Drug keys are the normalized names used everywhere else: lowercase,
# hyphenated, no spaces or slashes (e.g. piperacillin-tazobactam).
#
# synonyms       Raw spellings seen in BV-BRC / NCBI AST exports and lab
#                systems: WHONET / CLSI / EUCAST abbreviations, salt forms,
#                brand names, slash-separated combination names. Matching is
#                case-insensitive and ignores whitespace / slash / hyphen
#                differences, so one spelling per distinct token sequence is
#                enough.
# spectrum_tier  1 narrowest ... 4 broadest / reserve. Likely-active drugs are
#                ranked narrowest first, then by margin below the S breakpoint.
# strong_markers Known-AMR feature columns (gene_* / point_*) whose presence
#                forces the call to likely_inactive regardless of the model
#                (override 2 in DATA_CONTRACT.md stage 12). Matched as column
#                prefixes so kept variants (gene_blakpc_2) still match. Every
#                carbapenemase prefix in keep_variant.csv (blaOXA-48, blaOXA-181,
#                blaOXA-232, ...) gets its own gene_ column and must be listed
#                here, or the override never sees it.
# strong_marker_exceptions
#                Optional. Column-name prefixes that never trigger the override although a
#                strong_markers prefix matches them (gene_mcr_9 under gene_mcr). Each must
#                narrow one of the drug's strong_markers prefixes.
# strong_subclasses
#                Optional. AMRFinderPlus Subclass values; a detected ACQUIRED gene
#                (Subtype AMR, never a POINT mutation such as an ompK36 porin
#                change) carrying one of them also forces likely_inactive. The
#                carbapenems list CARBAPENEM so carbapenemases whose family column
#                is shared with non-carbapenemases (blaOXA-23/-24/-58 and blaOXA-1
#                all map to gene_blaoxa; blaGES-5 and blaGES-1 to gene_blages) or
#                that no prefix covers (blaIMI, blaSME, ...) still trigger it.
#                Intrinsic genes never trigger either rule: AMRFinderPlus reports the
#                chromosomal OXA-51-like genes of A. baumannii (blaOXA-51, -66, -69,
#                ...) with Subclass CARBAPENEM, so configs/intrinsic_markers.csv lists
#                the whole OXA-51 family for ABAU (AMRFinderPlus DB 2026-08-07.1) and
#                the override skips them (predict and training-time call metrics).
#                Not modelled: ISAba1 upstream of an OXA-51-like gene (raises
#                carbapenem MICs); the model has to learn that from other features.
#
# call_standard  Breakpoint table used for pred_sir and for the final call. CLSI 2024
#                (user decision: US standard; the tables are unverified, see
#                docs/BREAKPOINT_VERIFICATION.md).

call_standard:
  standard: CLSI
  version: "2024"

