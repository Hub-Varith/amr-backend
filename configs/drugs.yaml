# Drug panel for bloodstream infection in the 5 species. Draft: review with the team.
# Names: lowercase, hyphenated, no spaces. Synonyms are matched after lowercasing and
# turning "/" and spaces into "-" (so "piperacillin/tazobactam" needs no synonym).
# tier: WHO AWaRe group used as the spectrum tier for ranking (1 Access, 2 Watch, 3 Reserve).
# Left out on purpose: urinary-only (nitrofurantoin), topical (mupirocin), veterinary
# (enrofloxacin, ceftiofur ...), screening-only (methicillin), and class names ("carbapenem").
drugs:
  penicillin: {tier: 1, synonyms: [benzylpenicillin, penicillin-g]}
  ampicillin: {tier: 1, synonyms: []}
  amoxicillin: {tier: 1, synonyms: []}
  amoxicillin-clavulanic-acid: {tier: 1, synonyms: [amoxicillin_clavulanat, amoxicillin-clavulanate, co-amoxiclav]}
