[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genome2mic"
version = "0.1.0"
description = "Predict antibiotic MIC from one bacterial genome. Predictions of in-vitro susceptibility, not prescribing advice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # FastAPI needs it to parse multipart file uploads.
    "python-multipart>=0.0.9",
    # Parses configs/species.yaml and configs/drugs.yaml for the readiness check.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The shared multi-drug model (src/genome2mic/models). torch replaces per-drug xgboost
# because one network can hold every drug head and a masked censored loss; see MODEL_DESIGN.md.
model = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]
# The data pipeline (src/genome2mic/ingest, genomes, qc, features, splits).
data = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
]
# Postgres job store on Neon (api/services/postgres_job_store.py). asyncpg is an async driver that
# fits FastAPI's async handlers without an ORM. Without it the API uses the in-memory store.
db = [
    "asyncpg>=0.30",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genome2mic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
