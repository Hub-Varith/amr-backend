[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genome2mic"
version = "0.1.0"
description = "Predict antibiotic MIC from one bacterial genome. Predictions of in-vitro susceptibility, not prescribing advice."
requires-python = ">=3.11"
dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # FastAPI needs it to parse multipart file uploads.
    "python-multipart>=0.0.9",
    # Parses configs/species.yaml and configs/drugs.yaml for the readiness check.
    "pyyaml>=6.0",
    # --- data + modelling stack (CLAUDE.md "Conventions") ---
    "pandas>=2.2",
    "pyarrow",
    "numpy",
    "scipy",
    "xgboost>=2.0",
    "scikit-learn",
    "shap",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# Workflow runner and the demo UI; not needed to train or serve predictions.
pipeline = [
    "snakemake",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
